name: Deploy production

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'Hieubkav/roundcubemail-reskin'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: host68.vietnix.vn
          username: phuongv2
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            /home/phuongv2/bin/rc-deploy.sh
