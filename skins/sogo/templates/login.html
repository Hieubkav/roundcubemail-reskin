<roundcube:include file="includes/layout.html" />

<h1 class="voice"><roundcube:object name="productname" /> <roundcube:label name="login" /></h1>

<div id="layout-content" class="selected no-navbar" role="main">
	<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none;opacity:0">
		<defs>
			<filter id="satek-logo-dark" color-interpolation-filters="sRGB">
				<feColorMatrix type="matrix" values="
					 0.05  0     0     0  0.95
					-0.40  0     0.40  0  0.96
					-0.97  0     0.97  0  0.97
					 0     0     0     1  0" />
			</filter>
		</defs>
	</svg>

	<div class="satek-login-shell">
		<div class="satek-login-card"
			data-email-label="<roundcube:label name='sateklogin_email' />"
			data-pwd-show="<roundcube:label name='sateklogin_showpwd' />"
			data-pwd-hide="<roundcube:label name='sateklogin_hidepwd' />">

			<div class="satek-login-visual" aria-hidden="true">
				<svg class="satek-login-svg" viewBox="0 0 420 330" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
					<defs>
						<linearGradient id="illHdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
							<stop offset="0%" style="stop-color:var(--ill-hdr-a)" />
							<stop offset="100%" style="stop-color:var(--ill-hdr-b)" />
						</linearGradient>
						<linearGradient id="illTrayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
							<stop offset="0%" style="stop-color:var(--ill-tray-a)" />
							<stop offset="100%" style="stop-color:var(--ill-tray-b)" />
						</linearGradient>
						<linearGradient id="illPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
							<stop offset="0%" style="stop-color:var(--ill-plane-a)" />
							<stop offset="100%" style="stop-color:var(--ill-plane-b)" />
						</linearGradient>
						<filter id="illShadowSoft" x="-14%" y="-14%" width="132%" height="136%">
							<feDropShadow dx="0" dy="10" stdDeviation="11" style="flood-color:var(--ill-shadow);flood-opacity:1" />
						</filter>
						<filter id="illShadowFloat" x="-18%" y="-18%" width="140%" height="145%">
							<feDropShadow dx="0" dy="7" stdDeviation="8" style="flood-color:var(--ill-shadow);flood-opacity:1" />
						</filter>
						<radialGradient id="illHaloGrad" cx="50%" cy="50%" r="50%">
							<stop offset="0%" style="stop-color:var(--ill-blob);stop-opacity:1" />
							<stop offset="72%" style="stop-color:var(--ill-blob);stop-opacity:0.45" />
							<stop offset="100%" style="stop-color:var(--ill-blob);stop-opacity:0" />
						</radialGradient>
						<clipPath id="illWinClip">
							<rect x="0" y="0" width="252" height="180" rx="14" />
						</clipPath>
					</defs>

					<!-- Clean soft ambient glow behind composition (no awkward swoosh/dot) -->
					<circle cx="192" cy="168" r="132" fill="url(#illHaloGrad)" />

					<!-- Sleek flight trail & paper plane -->
					<path d="M 252 98 C 284 80 312 62 336 42" fill="none" style="stroke:var(--ill-dash)" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round" />
					<g transform="translate(334, 16)" filter="url(#illShadowFloat)">
						<polygon points="0,16 40,2 25,28 14,20" fill="url(#illPlaneGrad)" />
						<polygon points="14,20 40,2 20,27 16,31" style="fill:var(--ill-plane-b)" />
						<polygon points="16,31 19.5,24 23.5,26.5" style="fill:var(--ill-plane-a)" />
					</g>

					<!-- Clean Webmail window -->
					<g transform="translate(46, 76) rotate(-1.5)" filter="url(#illShadowSoft)">
						<g clip-path="url(#illWinClip)">
							<rect x="0" y="0" width="252" height="180" style="fill:var(--ill-win-bg)" />
							<rect x="0" y="28" width="48" height="152" style="fill:var(--ill-rail-bg)" />
							<rect x="0" y="0" width="252" height="28" fill="url(#illHdrGrad)" />
						</g>
						<rect x="0" y="0" width="252" height="180" rx="14" fill="none" style="stroke:var(--ill-win-border)" stroke-width="1" />

						<!-- Window dots only -->
						<circle cx="15" cy="14" r="2.6" fill="#ffffff" opacity="0.58" />
						<circle cx="24" cy="14" r="2.6" fill="#ffffff" opacity="0.58" />
						<circle cx="33" cy="14" r="2.6" fill="#ffffff" opacity="0.58" />
						<rect x="196" y="11" width="40" height="6" rx="3" fill="#ffffff" opacity="0.22" />

						<!-- Slim navigation rail (evenly spaced) -->
						<rect x="10" y="42" width="28" height="26" rx="7" style="fill:var(--ill-accent-soft)" />
						<g transform="translate(17, 50)">
							<rect x="0" y="0" width="14" height="10" rx="2" style="fill:var(--ill-accent)" />
							<path d="M 1.5 2 L 7 6 L 12.5 2" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
						</g>
						<path d="M 24 84 L 25.7 87.5 L 29.5 88 L 26.7 90.7 L 27.4 94.5 L 24 92.7 L 20.6 94.5 L 21.3 90.7 L 18.5 88 L 22.3 87.5 Z" fill="none" style="stroke:var(--ill-icon-muted)" stroke-width="1.35" stroke-linejoin="round" />
						<path d="M 19 114 L 29.5 109 L 26 119.5 L 23.5 115.5 Z" fill="none" style="stroke:var(--ill-icon-muted)" stroke-width="1.35" stroke-linejoin="round" />
						<g style="stroke:var(--ill-icon-muted)" stroke-width="1.35" fill="none" stroke-linecap="round" stroke-linejoin="round">
							<path d="M 19.5 137 H 28.5 M 22.5 137 V 135.2 H 25.5 V 137 M 20.8 137 L 21.5 145.5 H 26.5 L 27.2 137" />
						</g>

						<!-- Clean inbox rows -->
						<g transform="translate(60, 42)">
							<rect x="0" y="0" width="176" height="36" rx="8" style="fill:var(--ill-row-bg);stroke:var(--ill-row-border)" stroke-width="1" />
							<circle cx="16" cy="18" r="7" style="fill:var(--ill-avatar)" />
							<rect x="31" y="11.5" width="76" height="4.8" rx="2.4" style="fill:var(--ill-line-a)" />
							<rect x="31" y="20.5" width="50" height="3.8" rx="1.9" style="fill:var(--ill-line-b)" />
							<circle cx="162" cy="18" r="3.4" style="fill:var(--ill-accent)" />
						</g>
						<g transform="translate(60, 86)">
							<rect x="0" y="0" width="176" height="36" rx="8" style="fill:var(--ill-row-bg);stroke:var(--ill-row-border)" stroke-width="1" />
							<circle cx="16" cy="18" r="7" style="fill:var(--ill-avatar)" />
							<rect x="31" y="11.5" width="88" height="4.8" rx="2.4" style="fill:var(--ill-line-a)" />
							<rect x="31" y="20.5" width="58" height="3.8" rx="1.9" style="fill:var(--ill-line-b)" />
							<circle cx="162" cy="18" r="3.2" style="fill:var(--ill-line-b)" />
						</g>
						<g transform="translate(60, 130)">
							<rect x="0" y="0" width="176" height="34" rx="8" style="fill:var(--ill-row-bg);stroke:var(--ill-row-border)" stroke-width="1" />
							<circle cx="16" cy="17" r="6.8" style="fill:var(--ill-avatar)" />
							<rect x="31" y="10.5" width="64" height="4.8" rx="2.4" style="fill:var(--ill-line-a)" />
							<rect x="31" y="19.5" width="44" height="3.8" rx="1.9" style="fill:var(--ill-line-b)" />
							<circle cx="162" cy="17" r="3.2" style="fill:var(--ill-line-b)" />
						</g>
					</g>

					<!-- Floating mail notification card -->
					<g transform="translate(234, 74)" filter="url(#illShadowFloat)">
						<rect x="0" y="0" width="124" height="44" rx="10" style="fill:var(--ill-win-bg);stroke:var(--ill-win-border)" stroke-width="1" />
						<rect x="9" y="9" width="26" height="26" rx="7" style="fill:var(--ill-accent)" />
						<rect x="15" y="17" width="14" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1.4" />
						<path d="M 16 18 L 22 22.5 L 28 18" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
						<rect x="43" y="14.5" width="62" height="4.8" rx="2.4" style="fill:var(--ill-line-a)" />
						<rect x="43" y="24" width="42" height="4" rx="2" style="fill:var(--ill-line-b)" />
					</g>

					<!-- Sleek open inbox tray with crisp popped envelope -->
					<g transform="translate(230, 192)" filter="url(#illShadowSoft)">
						<rect x="6" y="18" width="118" height="44" rx="10" style="fill:var(--ill-tray-back)" />
						<rect x="17" y="2" width="96" height="54" rx="8" style="fill:var(--ill-env-bg);stroke:var(--ill-env-border)" stroke-width="1.1" />
						<path d="M 20 8 L 65 36 L 110 8" fill="none" style="stroke:var(--ill-env-stroke)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
						<path d="M 6 33 L 40 33 C 46 33 49 37 52 41 C 56 46 60 48 65 48 C 70 48 74 46 78 41 C 81 37 84 33 90 33 L 124 33 L 124 72 C 124 79 118 84 111 84 L 19 84 C 12 84 6 79 6 72 Z" fill="url(#illTrayGrad)" />
						<path d="M 12 34.5 H 40 C 45 34.5 48 38 52 42.5 C 56 47 60 49 65 49 C 70 49 74 47 78 42.5 C 82 38 85 34.5 90 34.5 H 118" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.4" stroke-linecap="round" />
					</g>
				</svg>
			</div>

			<div class="satek-login-pane">
				<div class="satek-login-brand">
					<roundcube:object name="logo" src="/images/logo-satek.png" id="logo" alt="Satek" logo-type="satek" />
				</div>

				<div class="satek-login-header">
					<h2 class="satek-login-heading"><roundcube:label name="sateklogin_title" /></h2>
					<p class="satek-login-subtitle"><roundcube:label name="sateklogin_subtitle" /></p>
				</div>

				<roundcube:form id="login-form" name="login-form" method="post" class="propform">
				<roundcube:object name="loginform" form="login-form" size="40" submit=true class="form-control" />
					<div id="login-footer" role="contentinfo"><roundcube:container name="loginfooter" id="login-footer" /></div>
				</form>
			</div>

		</div>
	</div>
</div>

<noscript>
	<p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>

<roundcube:include file="includes/footer.html" />
